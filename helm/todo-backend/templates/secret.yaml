apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-backend.fullname" . }}-secret
  labels:
    {{- include "todo-backend.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.DATABASE_URL }}
  DATABASE_URL: {{ .Values.secrets.DATABASE_URL | b64enc | quote }}
  {{- else }}
  DATABASE_URL: {{ "postgresql://user:password@localhost:5432/todo_db" | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.COHERE_API_KEY }}
  COHERE_API_KEY: {{ .Values.secrets.COHERE_API_KEY | b64enc | quote }}
  {{- else }}
  COHERE_API_KEY: {{ "your-cohere-api-key-here" | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.BETTER_AUTH_SECRET }}
  BETTER_AUTH_SECRET: {{ .Values.secrets.BETTER_AUTH_SECRET | b64enc | quote }}
  {{- else }}
  BETTER_AUTH_SECRET: {{ "your-better-auth-secret-here" | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.JWT_SECRET }}
  JWT_SECRET: {{ .Values.secrets.JWT_SECRET | b64enc | quote }}
  {{- else }}
  JWT_SECRET: {{ "your-jwt-secret-here" | b64enc | quote }}
  {{- end }}
